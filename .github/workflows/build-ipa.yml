name: Build Cristian Control IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Compilar Cristian Control
        run: |
          set -euo pipefail

          xcodebuild \
            -project CristianControl.xcodeproj \
            -scheme CristianControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Crear IPA
        run: |
          set -euo pipefail

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró la aplicación compilada."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/CristianControl.app

          zip -qry CristianControl-iPhone.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: CristianControl-iPhone
          path: CristianControl-iPhone.ipa
